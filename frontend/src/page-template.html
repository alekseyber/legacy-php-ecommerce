<!DOCTYPE html>
<html lang="ru">
  <head>
    <base href="/" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/favicon.png" type="image/png" />
    <title>Категория | Демо-магазин</title>
  </head>

  <body>
    <main class="bmd-layout-content">
      <!-- <div class="fixed-bl d-none"></div> -->
      <div class="page-content">
        <!-- селектор страницы контента -->
        <div class="content-wr">
          <!-- страница -->
          <div class="container">
            <nav class="nav-breadcrumb">
              <ol
                class="breadcrumb"
                itemscope=""
                itemtype="http://schema.org/BreadcrumbList"
              >
                <li
                  class="breadcrumb-item"
                  itemprop="itemListElement"
                  itemscope=""
                  itemtype="http://schema.org/ListItem"
                >
                  <a class="js-link-true2" itemprop="item" href="/">
                    <span itemprop="name" class="material-icons">home</span>
                  </a>
                  <meta itemprop="position" content="1" />
                </li>
                <li
                  class="breadcrumb-item active"
                  itemprop="itemListElement"
                  itemscope=""
                  itemtype="http://schema.org/ListItem"
                >
                  <a class="disabled" itemprop="item" href="#">
                    <span itemprop="name">Новости</span></a
                  >
                  <meta itemprop="position" content="2" />
                </li>
              </ol>
              <a href="javascript:history.back();" class="breadcrumbs-back">
                <span class="material-icons mr-1">arrow_back</span>Назад
              </a>
            </nav>
            <div class="sec-page sec"> <!-- внутри тело страницы -->
              <header class="sec-page-header">
                <h1 class="sec-title">Новости блог</h1>
              </header>
              <!--  <div class="pagin-cont"></div>     обертка если есть пагинация-->
              
            </div>
            <!-- sec-page sec-->
          </div>
          <!--  container-->
        </div>
        <!--  content-wr-->
      </div>
      <!--  page-content-->

      <div class="preloader">
        <div>
          <div class="d-flex align-items-center">
            <div class="spinner-border" role="status">
              <span class="sr-only">Loading...</span>
            </div>
          </div>
        </div>
      </div>
      <div class="top-scr-btn">
        <button
          type="button"
          class="btn btn-primary bmd-btn-fab"
          id="topScrBtn"
        >
          <i class="material-icons">arrow_upward</i>
        </button>
      </div>
      <div class="bottom-alerts">
        <!-- show -->
        <div
          class="alert alert-danger alert-dismissible fade"
          id="js-alert-danger"
          data-dismiss="alert"
          role="alert"
        >
          <div class="js-allert-message"></div>
          <button
            type="button"
            class="close"
            data-dismiss="alert"
            aria-label="Close"
          >
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div
          class="alert alert-success alert-dismissible fade"
          id="js-alert-success"
          data-dismiss="alert"
          role="alert"
        >
          <div class="js-allert-message"></div>
          <button
            type="button"
            class="close"
            data-dismiss="alert"
            aria-label="Close"
          >
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
      </div>
    </main>
  </body>
</html>
